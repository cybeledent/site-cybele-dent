<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>CybèleStock — Cabinet dentaire</title>
  <!-- Icônes application (onglet, écran d'accueil iPhone/Android) -->
  <link rel="icon" href="appicon.png?v=1" type="image/png">
  <link rel="apple-touch-icon" href="appicon.png?v=1">
  <link rel="manifest" href="manifest.webmanifest?v=1">
  <meta name="theme-color" content="#10947a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="CybèleStock">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=1">
</head>
<body>

  <!-- En-tête -->
  <header class="app-header">
    <div class="app-header-inner">
      <a class="brand" href="#" id="brand-home">
        <span class="brand-mark">📦</span>
        <span class="brand-text">Cybèle<strong>Stock</strong></span>
      </a>
      <div class="header-actions">
        <button class="btn-icon" id="btn-help" title="Aide">?</button>
        <button class="btn-ghost-sm" id="btn-export" title="Sauvegarder mes données">⬇<span class="btn-label"> Sauvegarde</span></button>
        <button class="btn-ghost-sm" id="btn-import" title="Restaurer une sauvegarde">⬆<span class="btn-label"> Restaurer</span></button>
        <button class="btn-ghost-sm" id="btn-logout" title="Se déconnecter" hidden>⏻</button>
        <input type="file" id="import-file" accept="application/json" hidden>
      </div>
    </div>
  </header>

  <!-- Navigation principale (haut sur ordinateur, bas sur téléphone) -->
  <nav class="main-nav" id="main-nav">
    <button class="nav-tab active" data-nav="stock"><span class="nav-ico">📦</span><span class="nav-label">Stock</span></button>
    <button class="nav-tab" data-nav="scan"><span class="nav-ico">📷</span><span class="nav-label">Scanner</span></button>
    <button class="nav-tab" data-nav="courses"><span class="nav-ico">🛒</span><span class="nav-label">Courses</span><span class="nav-badge" id="badge-courses" hidden></span></button>
    <button class="nav-tab" data-nav="peremption"><span class="nav-ico">⏰</span><span class="nav-label">Péremption</span><span class="nav-badge" id="badge-peremption" hidden></span></button>
    <button class="nav-tab" data-nav="reglages"><span class="nav-ico">⚙️</span><span class="nav-label">Réglages</span></button>
  </nav>

  <!-- Contenu -->
  <main id="app" class="app-main"><!-- rendu dynamique --></main>

  <!-- Fenêtres modales -->
  <div id="modal-root"></div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="firebase-db.js?v=1"></script>
  <!-- Lecteur de codes-barres / Datamatrix -->
  <script src="vendor/html5-qrcode.min.js?v=1"></script>
  <!-- Application -->
  <script src="app.js?v=1"></script>
</body>
</html>
